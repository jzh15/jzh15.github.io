name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

concurrency:
  group: update-citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    # The citation fetch can be slow/unreliable; allow retries to finish.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A PAT is required for citation-update commits to trigger deploy.yml.
          # Fall back to github.token so the workflow still runs before PAT is configured.
          token: ${{ secrets.PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Running citation update script with retries..."
          start_time=$(date)
          success=0
          for attempt in 1 2 3; do
            echo "🔁 Attempt ${attempt}/3..."
            if timeout 600 python bin/update_scholar_citations.py; then
              success=1
              break
            else
              status=$?
              if [ "${status}" -eq 124 ]; then
                echo "⚠️ Attempt ${attempt} timed out after 600 seconds."
              else
                echo "⚠️ Attempt ${attempt} failed with exit code ${status}."
              fi
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep_seconds=$((attempt * 20))
              echo "⏳ Waiting ${sleep_seconds}s before retry..."
              sleep "${sleep_seconds}"
            fi
          done

          if [ "${success}" -ne 1 ]; then
            echo "❌ Citation update failed after 3 attempts." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          end_time=$(date)
          echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
          echo "✅ Citation update succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git add _data/citations.yml
          if git diff --staged --quiet; then
            echo "ℹ️ No citation changes to commit."
            exit 0
          fi

          echo "📤 Committing citation changes..."
          git commit -m "Update Google Scholar citations"

          target_branch="${GITHUB_REF_NAME:-main}"
          echo "🎯 Target branch: ${target_branch}"

          for attempt in 1 2 3; do
            echo "🚀 Push attempt ${attempt}/3..."
            if git push origin "HEAD:${target_branch}"; then
              echo "✅ Push succeeded."
              exit 0
            fi

            echo "⚠️ Push rejected. Rebasing onto origin/${target_branch} and retrying..."
            git fetch origin "${target_branch}"
            git rebase "origin/${target_branch}"
            sleep_seconds=$((attempt * 5))
            echo "⏳ Waiting ${sleep_seconds}s before next push attempt..."
            sleep "${sleep_seconds}"
          done

          echo "❌ Failed to push citation update after 3 attempts."
          exit 1
